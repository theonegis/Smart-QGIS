[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-qgis"
version = "2.0.0"
description = "Headless QGIS MCP tools for existing AI agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp>=1.28,<2", "langchain-core>=1,<2", "pydantic>=2.11,<3"]

[project.scripts]
smart-qgis = "smart_qgis.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "pillow>=11", "pypdf>=5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires an installed QGIS runtime"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/smart_qgis"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
